# Dataset de evaluación — Tarea B (revisión de código con lista de verificación de seguridad) — VotoEPIS
# Variables: id, archivo, codigo (con número de línea), lineas (cantidad de líneas),
#            esperado (reglas que DEBEN aparecer, formato Sx@linea-inicial-linea-final separado por ';';
#            vacío = código correcto, el revisor debe aprobar).

- description: "C1 · padron.py · Consulta SQL armada por concatenación"
  vars:
    id: C1
    archivo: padron.py
    esperado: "S2@2-3"
    lineas: 4
    codigo: |
      1: def buscar_estudiante(cur, correo):
      2:     consulta = "SELECT id FROM padron WHERE correo = '" + correo + "'"
      3:     cur.execute(consulta)
      4:     return cur.fetchone()

- description: "C2 · urna.py · La urna guarda la identidad junto al voto"
  vars:
    id: C2
    archivo: urna.py
    esperado: "S1@2-3"
    lineas: 3
    codigo: |
      1: def registrar_voto(cur, estudiante_id, eleccion_id, lista_id):
      2:     cur.execute("INSERT INTO urna (eleccion_id, lista_id, estudiante_id) VALUES (%s, %s, %s)",
      3:                 (eleccion_id, lista_id, estudiante_id))

- description: "C3 · correo.py · Contraseña de correo escrita en el código"
  vars:
    id: C3
    archivo: correo.py
    esperado: "S3@3-3"
    lineas: 8
    codigo: |
      1: import smtplib
      2: SMTP_USUARIO = "votoepis@unsa.edu.pe"
      3: SMTP_CLAVE = "clave-de-ejemplo-no-real"
      4: 
      5: def enviar(correo, texto):
      6:     with smtplib.SMTP("smtp.unsa.edu.pe", 587) as s:
      7:         s.login(SMTP_USUARIO, SMTP_CLAVE)
      8:         s.sendmail(SMTP_USUARIO, correo, texto)

- description: "C4 · votacion.py · El log une correo y lista elegida"
  vars:
    id: C4
    archivo: votacion.py
    esperado: "S1@5-5;S6@5-5"
    lineas: 5
    codigo: |
      1: import logging
      2: log = logging.getLogger("votacion")
      3: 
      4: def emitir(estudiante, lista):
      5:     log.info("Voto emitido por %s para la lista %s", estudiante.correo, lista.nombre)

- description: "C5 · otp.py · OTP sin expiración ni límite de intentos"
  vars:
    id: C5
    archivo: otp.py
    esperado: "S5@2-2"
    lineas: 5
    codigo: |
      1: def verificar_otp(sesion, codigo):
      2:     if sesion.otp == codigo:
      3:         sesion.autenticada = True
      4:         return True
      5:     return False

