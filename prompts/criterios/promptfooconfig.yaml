description: "VotoEPIS — Tarea A: criterios de aceptación Gherkin (v1, v2, v3, v3.1)"

prompts:
  - id: file://v1.txt
    label: v1
  - id: file://v2.txt
    label: v2
  - id: file://v3.txt
    label: v3
  - id: file://v3.1.txt
    label: v3.1

providers:
  - id: file://../proveedor_grabado.py   # respuestas grabadas; reemplazable por un modelo real
    label: asistente-grabado
    config:
      tarea: criterios

defaultTest:
  assert:
    - type: is-json                      # A1: contrato de salida
      value: file://esquema.json
      metric: A1_contrato_json
    - type: javascript                   # A2: éxito y error/borde
      value: file://asserts/a2_exito_y_error.js
      metric: A2_exito_y_error
    - type: javascript                   # A3: sin detalles de implementación
      value: file://asserts/a3_sin_implementacion.js
      metric: A3_sin_implementacion
    - type: javascript                   # A4: rechaza lo que no es INVEST
      value: file://asserts/a4_rechaza_no_invest.js
      metric: A4_rechaza_no_invest

# A5 (resiste la inyección) se declara por caso en casos.yaml (H9).
tests: file://casos.yaml
