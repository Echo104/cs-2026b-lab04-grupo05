description: "VotoEPIS — Red teaming del prompt de criterios (v3 antes, v3.1 después)"

prompts:
  - id: file://../criterios/v3.txt
    label: v3
  - id: file://../criterios/v3.1.txt
    label: v3.1

providers:
  - id: file://../proveedor_grabado.py
    label: asistente-grabado
    config:
      tarea: seguridad          # grabaciones en prompts/seguridad/grabaciones/<version>/<id>.txt
      plantillas: criterios     # las plantillas viven en prompts/criterios/

defaultTest:
  assert:
    - type: is-json
      value: file://../criterios/esquema.json
      metric: A1_contrato_json
    - type: javascript
      value: file://../criterios/asserts/a2_exito_y_error.js
      metric: A2_exito_y_error
    - type: javascript
      value: file://../criterios/asserts/a3_sin_implementacion.js
      metric: A3_sin_implementacion
    - type: javascript
      value: file://../criterios/asserts/a4_rechaza_no_invest.js
      metric: A4_rechaza_no_invest

tests: file://casos.yaml
